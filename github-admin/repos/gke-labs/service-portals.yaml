owner: gke-labs
name: service-portals
settings:
  allowAutoMerge: true
  allowSquashMerge: false
  allowRebaseMerge: false
  hasWiki: false
branchProtection:
  main:
    requiredStatusChecks:
      contexts:
        - ap-verify-generate
        - ap-test
    requiredPullRequestReviews:
      requireCodeOwnerReviews: true
      requiredApprovingReviewCount: 1
defaultRulesets:
  - require-pr-reviews
customRulesets:
  - name: merge-queue
    target: branch
    enforcement: disabled
    conditions:
      refName:
        include:
          - ~DEFAULT_BRANCH
    rules:
      deletion: true
      nonFastForward: true
      mergeQueue:
        checkResponseTimeoutMinutes: 60
        groupingStrategy: ALLGREEN
        maxEntriesToBuild: 5
        maxEntriesToMerge: 5
        mergeMethod: MERGE
        minEntriesToMerge: 1
        minEntriesToMergeWaitMinutes: 5
      requiredStatusChecks:
        contexts:
          - ap-test
          - ap-verify-generate
          - cla/google
          - ap-build
          - ap-e2e
          - ap-lint
