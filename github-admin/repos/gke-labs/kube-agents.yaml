# This repo requires a pull request but no approving reviews, so it carries
# a custom copy of require-pr-reviews with requiredApprovingReviewCount: 0
# (omitted below, as 0 is the zero value). That is an accepted per-repo choice.
customRulesets:
  - name: Code Quality Copilot review for default branch
    target: branch
    enforcement: disabled
    conditions:
      refName:
        include:
          - ~DEFAULT_BRANCH
    rules: {}
  - name: kube-agents-release-lines
    target: branch
    enforcement: active
    conditions:
      refName:
        include:
          - refs/heads/release/**
    rules:
      deletion: true
      nonFastForward: true
    bypassActors:
      - actorId: 143327
        actorType: Integration
        bypassMode: always
      - actorId: 4830165
        actorType: Integration
        bypassMode: always
  - name: kube-agents-release-lines-checks
    target: branch
    enforcement: active
    conditions:
      refName:
        include:
          - refs/heads/release/**
    rules:
      requiredStatusChecks:
        contexts:
          - cla/google
          - actionlint
          - build
          - prettier
          - validate
          - Run Controller Tests
          - Run Python Unit Tests
          - Documentation Checks
          - Validate Conventional Commit PR Title
          - Agent instructions cite assets that exist
    bypassActors:
      - actorId: 4830165
        actorType: Integration
        bypassMode: always
  - name: kube-agents-tag-protection
    target: tag
    enforcement: active
    conditions:
      refName:
        include:
          - ~ALL
    rules:
      deletion: true
      nonFastForward: true
    bypassActors:
      - actorId: 4830165
        actorType: Integration
        bypassMode: always
      - actorId: 15786916
        actorType: User
        bypassMode: always
  - name: require-pr-reviews
    target: branch
    enforcement: active
    conditions:
      refName:
        include:
          - ~DEFAULT_BRANCH
    rules:
      deletion: true
      nonFastForward: true
      pullRequest:
        allowedMergeMethods:
          - merge
          - squash
          - rebase
    bypassActors:
      - actorId: 5
        actorType: RepositoryRole
        bypassMode: always
