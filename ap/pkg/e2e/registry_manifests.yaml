apiVersion: v1
kind: Namespace
metadata:
  name: in-cluster-image-registry-system
---
apiVersion: v1
kind: Service
metadata:
  name: in-cluster-image-registry
  namespace: in-cluster-image-registry-system
spec:
  ports:
  - name: registry
    port: 5000
    targetPort: 5000
  - name: http
    port: 80
    targetPort: 5000
  selector:
    app: in-cluster-image-registry
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: in-cluster-image-registry
  namespace: in-cluster-image-registry-system
spec:
  serviceName: in-cluster-image-registry
  replicas: 1
  selector:
    matchLabels:
      app: in-cluster-image-registry
  template:
    metadata:
      labels:
        app: in-cluster-image-registry
    spec:
      containers:
      - name: registry
        image: registry:2
        ports:
        - containerPort: 5000
        env:
        - name: REGISTRY_HTTP_ADDR
          value: :5000
        volumeMounts:
        - name: data
          mountPath: /var/lib/registry
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
