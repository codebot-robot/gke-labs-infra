apiVersion: v1
kind: Namespace
metadata:
  name: autodeploy-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autodeploy-controller
  namespace: autodeploy-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autodeploy-controller
  template:
    metadata:
      labels:
        app: autodeploy-controller
    spec:
      serviceAccountName: autodeploy-controller
      containers:
      - name: controller
        image: autodeploy-controller
        env:
        - name: BUILDKIT_HOST
          value: tcp://buildkit:2375
        - name: IMAGE_PREFIX
          value: images.local
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autodeploy-controller
  namespace: autodeploy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: autodeploy-controller-role
rules:
- apiGroups: ["infra.labs.gke.io"]
  resources: ["packages"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["infra.labs.gke.io"]
  resources: ["packages/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services", "pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: autodeploy-controller-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: autodeploy-controller-role
subjects:
- kind: ServiceAccount
  name: autodeploy-controller
  namespace: autodeploy-system
